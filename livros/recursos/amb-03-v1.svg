<svg baseProfile="full" height="890px" version="1.1" viewBox="0 0 900 890" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs></defs><rect fill="#FFFFFF" height="890" rx="0" ry="0" stroke="#FFFFFF" stroke-width="1.4" width="900" x="0" y="0"></rect><text fill="#18334B" font-family="Arial,DejaVu Sans,sans-serif" font-size="28" font-weight="bold" text-anchor="start" x="42" y="55">ÁRVORE CONSTITUCIONAL</text><text fill="#106775" font-family="Arial,DejaVu Sans,sans-serif" font-size="16" font-weight="normal" text-anchor="start" x="42" y="86">Competência não é um poder único: identifique o tipo de ato</text><rect fill="#E7F0FA" height="110" rx="13" ry="13" stroke="#E7F0FA" stroke-width="1.4" width="760" x="70" y="125"></rect><text fill="#18334B" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="bold" text-anchor="middle" x="450.0" y="159">Constituição Federal de 1988</text><text fill="#23313B" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="normal" text-anchor="middle" x="450.0" y="191">Autonomia federativa + proteção ecológica comum</text><line stroke="#106775" stroke-linecap="round" stroke-width="3.5" x1="450" x2="450" y1="240" y2="262"></line><polyline fill="none" points="441,250 450,262 459,250" stroke="#106775" stroke-width="3.5"></polyline><rect fill="#EAF2F4" height="133" rx="13" ry="13" stroke="#EAF2F4" stroke-width="1.4" width="760" x="70" y="275"></rect><text fill="#18334B" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="bold" text-anchor="middle" x="450.0" y="309">ART. 23 • FAZER</text><text fill="#23313B" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="normal" text-anchor="middle" x="450.0" y="341">Competência administrativa comum</text><text fill="#23313B" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="normal" text-anchor="middle" x="450.0" y="366">LC 140/2011 distribui ações e formas de cooperação</text><line stroke="#106775" stroke-linecap="round" stroke-width="3.5" x1="450" x2="450" y1="412" y2="435"></line><polyline fill="none" points="441,423 450,435 459,423" stroke="#106775" stroke-width="3.5"></polyline><rect fill="#E6F1EA" height="133" rx="13" ry="13" stroke="#E6F1EA" stroke-width="1.4" width="760" x="70" y="447"></rect><text fill="#18334B" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="bold" text-anchor="middle" x="450.0" y="481">ARTS. 24 e 30 • NORMATIZAR</text><text fill="#23313B" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="normal" text-anchor="middle" x="450.0" y="513">Normas gerais da União; suplementação estadual</text><text fill="#23313B" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="normal" text-anchor="middle" x="450.0" y="538">Interesse local e suplementação municipal</text><line stroke="#106775" stroke-linecap="round" stroke-width="3.5" x1="450" x2="450" y1="584" y2="610"></line><polyline fill="none" points="441,598 450,610 459,598" stroke="#106775" stroke-width="3.5"></polyline><rect fill="#FFF4E3" height="135" rx="13" ry="13" stroke="#FFF4E3" stroke-width="1.4" width="760" x="70" y="623"></rect><text fill="#18334B" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="bold" text-anchor="middle" x="450.0" y="657">ART. 225 • PROTEGER</text><text fill="#23313B" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="normal" text-anchor="middle" x="450.0" y="689">Dever constitucional de proteção; EIA quando exigido</text><text fill="#23313B" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="normal" text-anchor="middle" x="450.0" y="714">O dever vincula todos, sem duplicar o licenciamento</text><text fill="#106775" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="450" y="822">A pergunta decisiva: legislar, licenciar, fiscalizar ou sancionar?</text></svg>