<svg baseProfile="full" height="1480px" version="1.1" viewBox="0 0 900 1480" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs></defs><rect fill="#FFFFFF" height="1480" rx="0" ry="0" stroke="#FFFFFF" stroke-width="1.4" width="900" x="0" y="0"></rect><text fill="#18334B" font-family="Arial,DejaVu Sans,sans-serif" font-size="28" font-weight="bold" text-anchor="start" x="42" y="55">FLUXO DECISÓRIO</text><text fill="#106775" font-family="Arial,DejaVu Sans,sans-serif" font-size="16" font-weight="normal" text-anchor="start" x="42" y="86">Separar a definição do licenciador da competência de fiscalização</text><rect fill="#E7F0FA" height="112" rx="13" ry="13" stroke="#E7F0FA" stroke-width="1.4" width="760" x="70" y="120"></rect><text fill="#18334B" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="bold" text-anchor="middle" x="450.0" y="154">1. QUAL É O ATO?</text><text fill="#23313B" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="normal" text-anchor="middle" x="450.0" y="186">Nova licença / renovação? → trilha de licenciamento</text><text fill="#23313B" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="normal" text-anchor="middle" x="450.0" y="211">Vistoria / dano / auto? → trilha de fiscalização</text><line stroke="#106775" stroke-linecap="round" stroke-width="3.5" x1="450" x2="450" y1="238" y2="259"></line><polyline fill="none" points="441,247 450,259 459,247" stroke="#106775" stroke-width="3.5"></polyline><rect fill="#EAF2F4" height="142" rx="13" ry="13" stroke="#EAF2F4" stroke-width="1.4" width="760" x="70" y="270"></rect><text fill="#18334B" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="bold" text-anchor="middle" x="450.0" y="304">2. IDENTIFICAR O LICENCIADOR</text><text fill="#23313B" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="normal" text-anchor="middle" x="450.0" y="336">LC 140: art. 7º (União), 8º (Estado), 9º (Município)</text><text fill="#23313B" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="normal" text-anchor="middle" x="450.0" y="361">DF reúne atribuições estaduais e municipais</text><line stroke="#106775" stroke-linecap="round" stroke-width="3.5" x1="450" x2="450" y1="418" y2="429"></line><polyline fill="none" points="441,417 450,429 459,417" stroke="#106775" stroke-width="3.5"></polyline><rect fill="#E6F1EA" height="132" rx="13" ry="13" stroke="#E6F1EA" stroke-width="1.4" width="760" x="70" y="440"></rect><text fill="#18334B" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="bold" text-anchor="middle" x="450.0" y="474">3. TESTAR HIPÓTESE FEDERAL</text><text fill="#23313B" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="normal" text-anchor="middle" x="450.0" y="506">Dois ou mais Estados? art. 7º, XIV, e</text><text fill="#23313B" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="normal" text-anchor="middle" x="450.0" y="531">Outras hipóteses? terras indígenas, mar, UCs e tipologias</text><line stroke="#106775" stroke-linecap="round" stroke-width="3.5" x1="450" x2="450" y1="578" y2="590"></line><polyline fill="none" points="441,578 450,590 459,578" stroke="#106775" stroke-width="3.5"></polyline><rect fill="#FFF4E3" height="145" rx="13" ry="13" stroke="#FFF4E3" stroke-width="1.4" width="760" x="70" y="601"></rect><text fill="#18334B" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="bold" text-anchor="middle" x="450.0" y="635">4. HÁ ESTRUTURA E PRAZO?</text><text fill="#23313B" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="normal" text-anchor="middle" x="450.0" y="667">Art. 15: ausência de órgão capacitado / conselho</text><text fill="#23313B" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="normal" text-anchor="middle" x="450.0" y="692">Mora injustificada na renovação: ADI 4.757</text><text fill="#23313B" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="normal" text-anchor="middle" x="450.0" y="717">Não existe licença tácita pelo decurso do prazo</text><line stroke="#106775" stroke-linecap="round" stroke-width="3.5" x1="450" x2="450" y1="752" y2="768"></line><polyline fill="none" points="441,756 450,768 459,756" stroke="#106775" stroke-width="3.5"></polyline><rect fill="#EAF2F4" height="145" rx="13" ry="13" stroke="#EAF2F4" stroke-width="1.4" width="760" x="70" y="779"></rect><text fill="#18334B" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="bold" text-anchor="middle" x="450.0" y="813">5. ÓRGÃOS INTERESSADOS PARTICIPAM</text><text fill="#23313B" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="normal" text-anchor="middle" x="450.0" y="845">LC 140, art. 13, §1º: manifestação não vinculante</text><text fill="#23313B" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="normal" text-anchor="middle" x="450.0" y="870">Sem exigir segunda licença do mesmo empreendimento</text><line stroke="#106775" stroke-linecap="round" stroke-width="3.5" x1="450" x2="450" y1="930" y2="947"></line><polyline fill="none" points="441,935 450,947 459,935" stroke="#106775" stroke-width="3.5"></polyline><rect fill="#E7F0FA" height="155" rx="13" ry="13" stroke="#E7F0FA" stroke-width="1.4" width="760" x="70" y="958"></rect><text fill="#18334B" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="bold" text-anchor="middle" x="450.0" y="992">6. VERIFICAR FISCALIZAÇÃO</text><text fill="#23313B" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="normal" text-anchor="middle" x="450.0" y="1024">Competência comum de monitoramento e inspeção</text><text fill="#23313B" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="normal" text-anchor="middle" x="450.0" y="1049">Art. 17: apuração pelo licenciador e medidas de proteção</text><text fill="#23313B" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="normal" text-anchor="middle" x="450.0" y="1074">Dano iminente: agir e comunicar o licenciador</text><line stroke="#106775" stroke-linecap="round" stroke-width="3.5" x1="450" x2="450" y1="1119" y2="1133"></line><polyline fill="none" points="441,1121 450,1133 459,1121" stroke="#106775" stroke-width="3.5"></polyline><rect fill="#E6F1EA" height="155" rx="13" ry="13" stroke="#E6F1EA" stroke-width="1.4" width="760" x="70" y="1144"></rect><text fill="#18334B" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="bold" text-anchor="middle" x="450.0" y="1178">7. CONFLITO ENTRE AUTOS?</text><text fill="#23313B" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="normal" text-anchor="middle" x="450.0" y="1210">Comparar mesmo fato, fundamentos, medidas e datas</text><text fill="#23313B" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="normal" text-anchor="middle" x="450.0" y="1235">Examinar omissão ou insuficiência da tutela</text><text fill="#23313B" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="normal" text-anchor="middle" x="450.0" y="1260">ADI 4.757 + art. 65 da Lei 15.190: cautela</text><text fill="#106775" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="450" y="1370">Formalizar consulta interinstitucional, provas e decisão motivada.</text></svg>