name: AGU Quiz · Integridade, estudo e acessibilidade
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '*.js'
      - 'dados/**'
      - 'lib/**'
      - 'tests/**'
      - '.github/workflows/agu-sprint20-ci.yml'
  workflow_dispatch:
jobs:
  integridade-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Node.js runtime
        run: node --version
      - name: Regressão Sprint 19
        run: node tests/sprint19-validacao.js
      - name: Regressão Sprint 20
        run: node tests/sprint20-validacao.js
      - name: Sprint 25 — limite em bytes e recuperação UTF-8 não destrutiva
        run: node tests/sprint25-validacao.js
      - name: Sprint 26 — anotações do Leitor devem ser texto válido
        run: node tests/sprint26-validacao.js
      - name: Sprint 27 — IDs e estados do Leitor no backup local
        run: node tests/sprint27-validacao.js
      - name: Sprint 29 — Espaço e Enter em unidades do Leitor
        run: node tests/sprint29-validacao.js
      - name: Sprint 30 — preservação do foco após seleção no Leitor
        run: node tests/sprint30-validacao.js
      - name: Sprint 31 — foco ao trocar artigo, aba e painel
        run: node tests/sprint31-validacao.js
      - name: Sprint 32 — foco nos comentários e filtros do Leitor
        run: node tests/sprint32-validacao.js
      - name: Sprint 33 — foco dos controles do Caderno, Estudo, Revisão e Plano
        run: node tests/sprint33-validacao.js
      - name: LEG-01 — catálogo, IDs e compatibilidade de notas
        run: node tests/leg01-validacao.js
      - name: WORK 01 — continuidade nos motores originais
        run: node tests/work01-validacao.js
      - name: Sprint 34 — retorno de foco após edição, encerramento, catálogo e tarefa
        run: node tests/sprint34-validacao.js
      - name: Sprint 35 — controles secundários e recuperação de foco
        run: node tests/sprint35-validacao.js
  navegador-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Playwright
        run: npm install --no-save playwright axe-core
      - name: Instalar Chromium e dependências
        run: npx playwright install --with-deps chromium
      - name: Fluxo real no navegador (emulação de viewport, não Android físico)
        run: node tests/sprint20-browser.cjs
      - name: Sprint 21 — quatro itens, viewport, teclas e restauração real
        run: node tests/sprint21-browser.cjs
      - name: Sprint 22 — backup completo de nove categorias e jornada mobile
        run: node tests/sprint22-browser.cjs
      - name: Sprint 22 — axe-core diagnóstico de acessibilidade
        run: node tests/sprint22-axe.cjs
      - name: Sprint 23 — foco, nove categorias e arquivos adversariais
        run: node tests/sprint23-browser.cjs
      - name: Sprint 23 — elementos inconclusivos axe e semântica
        run: node tests/sprint23-axe.cjs
      - name: Sprint 24 — contraste após rolagem, foco e toque emulado
        run: node tests/sprint24-contrast.cjs
      - name: Sprint 29 — teclado real nas unidades do Leitor em cinco viewports
        run: node tests/sprint29-browser.cjs
      - name: Sprint 30 — foco pós-ativação em cinco viewports
        run: node tests/sprint30-browser.cjs
      - name: Sprint 31 — continuidade de foco em cinco viewports
        run: node tests/sprint31-browser.cjs
      - name: Sprint 32 — foco dos formulários em cinco viewports
        run: node tests/sprint32-browser.cjs
      - name: Sprint 33 — teclado e foco em quatro módulos e cinco viewports
        run: node tests/sprint33-browser.cjs
      - name: WORK 01 — continuar estudo, responder e retomar em cinco viewports
        run: node tests/work01-browser.cjs
      - name: Sprint 34 — foco de retorno e tarefas em cinco viewports
        run: node tests/sprint34-browser.cjs
      - name: Sprint 35 — ações secundárias e foco em cinco viewports
        run: node tests/sprint35-browser.cjs
      - name: LEG-01 — leitor legado e expansão sintética
        run: node tests/leg01-browser.cjs
      - name: Guardar capturas de viewport sintéticas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agu-s20-chromium-viewports
          path: |
            tests/artifacts-s20/*.png
            tests/artifacts-s21/*.png
            tests/artifacts-s22/*.json
            tests/artifacts-s23/*.json
            tests/artifacts-s24/*.json
            tests/artifacts-s24/*.png
            tests/artifacts-s29/*.json
            tests/artifacts-s30/*.json
            tests/artifacts-s30/*.png
            tests/artifacts-s31/*.json
            tests/artifacts-s31/*.png
            tests/artifacts-s32/*.json
            tests/artifacts-s32/*.png
            tests/artifacts-s33/*.json
            tests/artifacts-s33/*.png
            tests/artifacts-leg01/*.json
            tests/artifacts-leg01/*.png
            tests/artifacts-work01/*.json
            tests/artifacts-work01/*.png
            tests/artifacts-s34/*.json
            tests/artifacts-s34/*.png
            tests/artifacts-s35/*.json
            tests/artifacts-s35/*.png
          if-no-files-found: ignore
          retention-days: 7

  pages-publicado:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar HTTPS, HTML e hashes do GitHub Pages ativo
        run: node tests/sprint21-pages.cjs
      - name: Instalar navegador para validar a URL publicada
        run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - name: Jornada real no GitHub Pages publicado
        env:
          AGU_TEST_URL: https://talksxb.github.io/agu-quiz/
        run: node tests/work01-browser.cjs
      - name: Guardar evidências sintéticas da URL publicada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agu-work01-publicado
          path: tests/artifacts-work01/
          if-no-files-found: ignore
          retention-days: 7

