{id:'a1',topic:'ADM/Atos administrativos',type:'ce',dim:'requisitos',level:1,stem:'À luz da Lei 9.784/1999, a competência administrativa é renunciável sempre que o órgão considerar que a renúncia atende melhor à eficiência.',opts:['Certo','Errado'],right:1,why:'A competência é irrenunciável; delegação e avocação são admitidas nas hipóteses legalmente previstas (art. 11). Eficiência não autoriza renúncia.',source:sourceAdm,error:'norma'},
{id:'a2',topic:'ADM/Atos administrativos',type:'mc',dim:'aplicação',level:2,stem:'Um ministro pretende delegar a edição de ato normativo a um subordinado. Qual a resposta jurídica adequada?',opts:['A delegação é válida, pois há hierarquia.','A delegação é vedada para a edição de atos de caráter normativo.','A delegação depende somente de autorização verbal.','A delegação será válida se houver urgência administrativa.'],right:1,why:'O art. 13, I, da Lei 9.784/1999 exclui a edição de atos de caráter normativo das competências delegáveis.',source:sourceAdm,error:'exceção'},
{id:'a3',topic:'ADM/Atos administrativos',type:'open',dim:'argumentação',level:3,stem:'Uma autarquia recebe orientação ministerial para decidir recurso administrativo em determinado sentido. Delimite a relação entre vinculação e hierarquia e formule uma conclusão jurídica prudente. Inclua uma objeção à sua própria posição.',rubric:['Delimita a questão e o vínculo institucional','Distingue orientação e substituição de competência','Indica fundamento normativo a verificar','Enfrenta uma objeção relevante','Conclui com providências e cautelas'],source:pending},

{id:'c1',topic:'CON/Constituição e poder constituinte',type:'mc',dim:'fundamentos',level:1,stem:'Qual descrição melhor distingue o poder constituinte originário dos poderes constituídos?',opts:['Ambos derivam necessariamente da legislação ordinária anterior.','O originário funda uma nova ordem constitucional; os constituídos exercem competências instituídas por ela.','O originário é exercido exclusivamente pelos tribunais.','Os poderes constituídos podem reformar a Constituição sem limites.'],right:1,why:'A formulação adota uma distinção doutrinária geral; nuances sobre legitimidade e limites materiais exigem investigação adicional.',source:pending,error:'conceito'},
{id:'c2',topic:'CON/Constituição e poder constituinte',type:'open',dim:'transferência',level:3,stem:'Um novo texto constitucional é amplamente aplicado pelas instituições, mas sua elaboração careceu de participação democrática. Distinga validade, eficácia sociológica e legitimidade e apresente sua tese com uma objeção séria.',rubric:['Distingue os três planos','Indica a premissa teórica adotada','Explicita objeção concorrente','Evita confundir efetividade com legitimidade','Formula conclusão fundamentada'],source:pending},
{id:'f1',topic:'FIN/Lei de Responsabilidade Fiscal',type:'ce',dim:'requisitos',level:1,stem:'A responsabilidade na gestão fiscal, na formulação da LC 101/2000, pressupõe ação planejada e transparente, com prevenção de riscos e correção de desvios.',opts:['Certo','Errado'],right:0,why:'Enunciado consistente com o art. 1º, §1º, da LRF.',source:sourceLrf,error:'norma'},

{"id":"s10adm04","topic":"ADM/Atos administrativos","type":"ce","dim":"autoria do ato","level":3,"stem":"As decisões adotadas por delegação administrativa consideram-se editadas pela autoridade delegante, ainda que assinadas pelo delegado.","right":1,"why":"ERRADO. Pelo art. 14, § 3º, as decisões devem mencionar explicitamente a delegação e consideram-se editadas pelo delegado. Cuidado com a troca entre delegante e delegado.","opts":["Certo","Errado"],"source":{"label":"Lei 9.784/1999, art. 14, § 3º","url":"https://www2.camara.leg.br/legin/fed/lei/1999/lei-9784-29-janeiro-1999-322239-normaatualizada-pl.html","verified":"2026-11-10","status":"consulta pontual à norma oficial; item autoral, sem homologação independente"},"error":"treino_cebraspe","style":"autoral_estilo_cebraspe"},
{"id":"s10adm05","topic":"ADM/Atos administrativos","type":"ce","dim":"limites","level":3,"stem":"Em processo administrativo federal, a autoridade poderá delegar a decisão de recurso administrativo sempre que publicar previamente o ato de delegação.","right":1,"why":"ERRADO. O art. 13, II, veda delegar decisão de recursos administrativos. A publicação não supera proibição legal expressa.","opts":["Certo","Errado"],"source":{"label":"Lei 9.784/1999, arts. 13, II, e 14","url":"https://www2.camara.leg.br/legin/fed/lei/1999/lei-9784-29-janeiro-1999-322239-normaatualizada-pl.html","verified":"2026-11-10","status":"consulta pontual à norma oficial; item autoral, sem homologação independente"},"error":"treino_cebraspe","style":"autoral_estilo_cebraspe"},
{"id":"s10pc01","topic":"PC/Normas fundamentais","type":"ce","dim":"contraditório","level":2,"stem":"No processo civil, o juiz não poderá decidir com base em fundamento sobre o qual não tenha dado às partes oportunidade de se manifestar, ainda que a matéria seja cognoscível de ofício.","right":0,"why":"CERTO. O art. 10 do CPC veda a decisão-surpresa. O conhecimento de ofício não dispensa, por si só, a oportunidade de manifestação.","opts":["Certo","Errado"],"source":{"label":"CPC, art. 10","url":"https://planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13105compilada.htm","verified":"2026-11-10","status":"consulta pontual à norma oficial; item autoral, sem homologação independente"},"error":"treino_cebraspe","style":"autoral_estilo_cebraspe"},
{"id":"s10pc02","topic":"PC/Normas fundamentais","type":"ce","dim":"exceção","level":2,"stem":"O contraditório prévio é requisito absoluto para toda decisão judicial, inclusive a concessão de tutela provisória de urgência.","right":1,"why":"ERRADO. O art. 9º, parágrafo único, I, do CPC prevê exceção para tutela provisória de urgência. Não confunda contraditório prévio com contraditório diferido.","opts":["Certo","Errado"],"source":{"label":"CPC, art. 9º, parágrafo único, I","url":"https://planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13105compilada.htm","verified":"2026-11-10","status":"consulta pontual à norma oficial; item autoral, sem homologação independente"},"error":"treino_cebraspe","style":"autoral_estilo_cebraspe"},
{"id":"s10pc03","topic":"PC/Normas fundamentais","type":"ce","dim":"fundamentação","level":2,"stem":"Não se considera fundamentada a decisão que deixa de enfrentar argumento da parte capaz, em tese, de infirmar a conclusão adotada pelo julgador.","right":0,"why":"CERTO. O art. 489, § 1º, IV, do CPC exige enfrentar argumentos potencialmente aptos a alterar o resultado, não todas as manifestações irrelevantes.","opts":["Certo","Errado"],"source":{"label":"CPC, art. 489, § 1º, IV","url":"https://planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13105compilada.htm","verified":"2026-11-10","status":"consulta pontual à norma oficial; item autoral, sem homologação independente"},"error":"treino_cebraspe","style":"autoral_estilo_cebraspe"},
{"id":"s10pc04","topic":"PC/Normas fundamentais","type":"ce","dim":"precedentes","level":3,"stem":"Basta ao julgador mencionar o número de um precedente para fundamentar adequadamente a decisão, sem demonstrar a pertinência de seus fundamentos determinantes ao caso.","right":1,"why":"ERRADO. O art. 489, § 1º, V, do CPC exige identificar os fundamentos determinantes e demonstrar a adequação do caso ao precedente invocado.","opts":["Certo","Errado"],"source":{"label":"CPC, art. 489, § 1º, V","url":"https://planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13105compilada.htm","verified":"2026-11-10","status":"consulta pontual à norma oficial; item autoral, sem homologação independente"},"error":"treino_cebraspe","style":"autoral_estilo_cebraspe"},
{"id":"s10con01","topic":"CON/Advocacia pública","type":"ce","dim":"competência","level":2,"stem":"A AGU é a instituição incumbida da representação judicial e extrajudicial da União e exerce, nos termos da lei complementar pertinente, atividades de consultoria e assessoramento jurídico do Poder Executivo.","right":0,"why":"CERTO. Trata-se da configuração constitucional do art. 131, caput, da Constituição Federal. A atribuição consultiva está expressamente relacionada ao Poder Executivo.","opts":["Certo","Errado"],"source":{"label":"CF/1988, art. 131, caput","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicaocompilado.htm","verified":"2026-11-10","status":"consulta pontual à norma oficial; item autoral, sem homologação independente"},"error":"treino_cebraspe","style":"autoral_estilo_cebraspe"},
{"id":"s10con02","topic":"CON/Advocacia pública","type":"ce","dim":"exceção","level":3,"stem":"A execução da dívida ativa tributária da União é atribuição constitucional exclusiva da Defensoria Pública da União.","right":1,"why":"ERRADO. O art. 131, § 3º, da CF atribui a representação da União nessa execução à Procuradoria-Geral da Fazenda Nacional, observado o disposto em lei.","opts":["Certo","Errado"],"source":{"label":"CF/1988, art. 131, § 3º","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicaocompilado.htm","verified":"2026-11-10","status":"consulta pontual à norma oficial; item autoral, sem homologação independente"},"error":"treino_cebraspe","style":"autoral_estilo_cebraspe"},
{"id":"s10con03","topic":"CON/Advocacia pública","type":"ce","dim":"requisitos","level":2,"stem":"O ingresso nas classes iniciais das carreiras da AGU previstas no art. 131 da Constituição ocorre mediante concurso público de provas e títulos.","right":0,"why":"CERTO. Exigência literal do art. 131, § 2º, da Constituição. Diferencie essa regra das disposições gerais do art. 37.","opts":["Certo","Errado"],"source":{"label":"CF/1988, art. 131, § 2º","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicaocompilado.htm","verified":"2026-11-10","status":"consulta pontual à norma oficial; item autoral, sem homologação independente"},"error":"treino_cebraspe","style":"autoral_estilo_cebraspe"},
{"id":"s10adm06","topic":"ADM/Atos administrativos","type":"mc","dim":"caso AGU","level":3,"stem":"Um órgão federal deseja transferir parte de competência administrativa ordinária a outro órgão sem subordinação hierárquica. À luz da Lei 9.784/1999, qual é a orientação mais adequada?","opts":["A delegação é impossível entre órgãos sem hierarquia.","A delegação é admitida, se não houver impedimento legal, for parcial e conveniente nas hipóteses legais.","A delegação é admitida somente para decidir recursos administrativos.","A transferência será válida apenas se for irrevogável."],"right":1,"why":"A alternativa B é correta: art. 12 permite delegação parcial mesmo sem subordinação, observados impedimentos e conveniência legal. A é restritiva indevidamente; C afronta art. 13, II; D contradiz a revogabilidade do art. 14, § 2º.","source":{"label":"Lei 9.784/1999, arts. 12 a 14","url":"https://www2.camara.leg.br/legin/fed/lei/1999/lei-9784-29-janeiro-1999-322239-normaatualizada-pl.html","verified":"2026-11-10","status":"consulta pontual à norma oficial; item autoral, sem homologação independente"},"error":"treino_cebraspe","style":"autoral_estilo_cebraspe"},
{"id":"s10pc05","topic":"PC/Normas fundamentais","type":"mc","dim":"caso AGU","level":3,"stem":"Em demanda contra a União, o magistrado rejeita pedido com base em fundamento não debatido, embora cognoscível de ofício. Que providência melhor expressa o CPC?","opts":["A decisão é válida porque a matéria podia ser conhecida de ofício.","A decisão é válida apenas se proferida em segundo grau.","Deveria ter sido assegurada manifestação prévia das partes sobre o fundamento.","O contraditório é dispensado quando a parte demandada é a União."],"right":2,"why":"Alternativa C. O art. 10 do CPC exige oportunidade de manifestação sobre o fundamento mesmo em matérias de ofício, ressalvados os regimes e exceções legais específicos. As demais negam esse dever sem base normativa.","source":{"label":"CPC, art. 10","url":"https://planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13105compilada.htm","verified":"2026-11-10","status":"consulta pontual à norma oficial; item autoral, sem homologação independente"},"error":"treino_cebraspe","style":"autoral_estilo_cebraspe"}

['adm6','ADM/Organização administrativa','A desconcentração administrativa pressupõe a distribuição interna de atribuições entre órgãos de uma mesma pessoa jurídica.',0,'Desconcentração é distribuição interna de competências; descentralização envolve outra pessoa jurídica ou particular executor.','fundamentos'],
['adm7','ADM/Atos administrativos','A motivação escrita de um ato administrativo impede o reconhecimento de desvio de finalidade, desde que a autoridade seja formalmente competente.',1,'A motivação formal não sana finalidade desviada: devem ser examinados fatos, motivos e finalidade pública legal.','aplicação'],
['adm8','ADM/Processo administrativo','A delegação de competência para decidir recursos administrativos é permitida pela Lei 9.784/1999 se o delegante conservar poder de supervisão.',1,'O art. 13, II, veda a delegação de decisão de recursos administrativos, independentemente de supervisão.','exceções'],
['con3','CON/Constituição e poder constituinte','A eficácia social de uma Constituição e a legitimidade democrática de seu processo de elaboração são conceitos idênticos.',1,'Efetividade social e legitimidade são planos analíticos distintos; adoção institucional não comprova participação democrática.','distinções'],
['con4','CON/Constituição e poder constituinte','O poder constituinte derivado reformador é juridicamente condicionado pelas limitações impostas pela Constituição em vigor.',0,'O poder de reforma atua sob condições constitucionais, como forma, procedimento e limites materiais.','fundamentos'],
['con5','CON/Direitos fundamentais','A incidência de direitos fundamentais em um caso concreto elimina, por definição, qualquer necessidade de ponderar conflitos entre posições jurídicas protegidas.',1,'Direitos fundamentais podem entrar em tensão; a solução depende do regime aplicável e de justificação constitucional.','argumentação'],
['fin3','FIN/PPA, LDO e LOA','A lei de diretrizes orçamentárias orienta a elaboração da lei orçamentária anual, no sistema constitucional brasileiro.',0,'A LDO conecta o planejamento plurianual à proposta da LOA, nos termos do regime constitucional orçamentário.','fundamentos'],
['fin4','FIN/Créditos adicionais','Os créditos adicionais são, em regra, instrumentos de alteração do orçamento aprovado, e não uma nova espécie de plano plurianual.',0,'Os créditos adicionais modificam dotações orçamentárias conforme regime próprio; não se confundem com o PPA.','distinções'],

['trib1','TRIB/Competências tributárias','A competência tributária para instituir determinado tributo e a capacidade tributária ativa para arrecadá-lo são expressões necessariamente equivalentes.',1,'Competência tributária e capacidade ativa diferem em natureza e possibilidades de atribuição.','distinções'],

function validateMatrix(m){
 if(!m||!Array.isArray(m.disciplinas)||!Array.isArray(m.itens))throw Error('JSON não contém disciplinas e itens.');
 if(m.disciplinas.length!==14||m.itens.length!==412)throw Error('Esperados exatamente 14 disciplinas e 412 posições numeradas.');
 const ids=new Set(),ds=new Set(m.disciplinas.map(d=>d.codigo));
 if(ds.size!==14)throw Error('Códigos de disciplina duplicados.');
 const counts={};
 for(const x of m.itens){
  if(typeof x.id!=='string'||!/^[A-Z]+(?:-[A-Z]+)*-\d{2,3}$/.test(x.id)||ids.has(x.id))throw Error('Identificador inválido ou repetido: '+x.id);
  if(!ds.has(x.disciplina_codigo)||typeof x.titulo_operacional!=='string')throw Error('Item incompleto: '+x.id);
  ids.add(x.id);counts[x.disciplina_codigo]=(counts[x.disciplina_codigo]||0)+1;
 }
 for(const d of m.disciplinas){if(counts[d.codigo]!==d.quantidade_posicoes)throw Error('Contagem divergente em '+d.codigo)}
 if(m.certificacao==='CERTIFICADA' && m.contagem?.posicoes_com_texto_literal_integral_conferido!==412)throw Error('Certificação incoerente.');
 return true;
}

function explore(){let subs=D.filter(d=>scope==='all'||d[0]===scope);return heading('Explorar o edital','Diagnóstico liberado mesmo para conteúdos ainda não estudados nos chats')+`<div class="card"><h2>Escolha como praticar</h2><div class="btnrow"><button class="${quizMode==='ce'?'primary':'secondary'}" onclick="quizMode='ce';render()">Cartões Certo / Errado</button><button class="${quizMode==='all'?'primary':'secondary'}" onclick="quizMode='all';render()">Todos os formatos</button></div><p class="muted">Questões inéditas para treino, sem reprodução de itens oficiais. Acertos em assuntos novos geram diagnóstico preliminar, nunca domínio automaticamente.</p><label>Disciplina <select onchange="scope=this.value;render()"><option value="all">Todas as disciplinas</option>${D.map(d=>`<option value="${d[0]}" ${scope===d[0]?'selected':''}>${d[1]}</option>`).join('')}</select></label></div><div class="card section"><h2>Conteúdos para praticar agora</h2>${subs.map(d=>`<h3 style="margin:22px 0 8px">${esc(d[1])}</h3>${d[2].map(t=>{let id=topicId(d[0],t),count=Q.filter(q=>q.topic===id&&(quizMode!=='ce'||q.type==='ce')).length;let p=info(id);return `<div class="topic"><div><strong>${esc(t)}</strong><div class="muted small">${count} cartão(ões) · ${esc(p.state)} ${!data.answers.some(a=>a.topic===id)?'· conteúdo novo':''}</div></div><button class="secondary" ${count?`onclick="startQuiz('${id}')"`:'disabled title="Banco ainda não elaborado"'}>${count?'Praticar':'Em preparação'}</button></div>`}).join('')}`).join('')}</div><div class="note section">Cobertura ainda parcial. A ausência de questões em um tema não significa ausência desse tema no edital. Fontes sem verificação atual são identificadas como pendentes.</div>`}
function curriculum(){return heading('Mapa curricular','Matriz ampla de planejamento · aderência integral ao edital pendente de auditoria')+`<div class="tabrow">${D.map(d=>`<button class="tab ${d[0]===selectedDisc?'active':''}" onclick="selectedDisc='${d[0]}';render()">${d[0]}</button>`).join('')}</div>`+D.filter(d=>d[0]===selectedDisc).map(d=>`<div class="card"><h2>${d[1]}</h2>${d[2].map(t=>{let id=topicId(d[0],t),s=info(id);return `<div class="topic"><div><strong>${esc(t)}</strong><div class="small muted">${(Q.filter(x=>x.topic===id).length)} desafio(s) disponível(is) no MVP · ${s.evidence||0} evidências</div></div><div class="btnrow" style="margin:0"><span class="status ${s.state==='Domínio demonstrado'?'done':s.state==='Revisão necessária'?'review':''}">${s.state}</span><button class="secondary" ${Q.some(q=>q.topic===id)?`onclick="startQuiz('${id}')"`:'disabled title="Questões ainda não incluídas"'}>${Q.some(q=>q.topic===id)?'Estudar':'Pendente'}</button></div></div>`}).join('')}</div>`).join('')+`<p class="note">Os tópicos de disciplinas adicionais são marcadores de escopo, não uma declaração de cobertura integral validada do edital. Questões sem fonte atual verificada são rotuladas como hipóteses pedagógicas.</p>`}
let selectedDisc='ADM'; let quizMode='ce', scope='all', quizSeen=new Set(), lastQueue=[];
function startQuiz(t){topicChoice=t;current=questionFor(t);selected=null;feedback=null;followup=false;answerText='';view='quiz';if(current&&!demo){const p=data.topic[t]||{score:0,evidence:0};p.state=p.state==='Domínio demonstrado'?'Domínio demonstrado':p.state==='Não iniciado'?'Em investigação':p.state;data.topic[t]=p;persist()}render()}
function quiz(){let opts=[...new Set(Q.filter(q=>quizMode!=='ce'||q.type==='ce').map(q=>q.topic))];let h=heading('Treino estilo Cebraspe','Itens autorais com casos práticos, fonte legal e revisão de erros — sem confundir com provas oficiais')+`<div class="card"><div class="split"><label for="qtopic">Tema</label><select id="qtopic" onchange="startQuiz(this.value)">${opts.map(t=>`<option value="${t}" ${topicChoice===t?'selected':''}>${esc(t.replace('/',' · '))}</option>`).join('')}</select></div>`;if(!current){return h+`<div class="empty">Nenhum desafio disponível. Escolha um tema com questões cadastradas.</div></div>`}h+=`<div class="note"><b>Provas oficiais para estudo comparativo:</b> <a href="https://cdn.cebraspe.org.br/concursos/agu_22_advogado/arquivos/804_AGU_ADVOGADO_001_01.PDF" target="_blank" rel="noopener noreferrer">AGU 2023 (múltipla escolha)</a> · <a href="https://cdn.cebraspe.org.br/concursos/AGU_15_ADV/arquivos/187AGU_001_01.pdf" target="_blank" rel="noopener noreferrer">AGU 2015 (Certo/Errado)</a>. As questões abaixo são autorais e não transcrições das provas.</div><div class="section"><div class="split"><span class="chip">${current.type==='ce'?'Certo ou errado':current.type==='mc'?'Múltipla escolha':'Resposta jurídica aberta'}</span><span class="chip">${esc(current.dim)} · dificuldade ${current.level}/3</span></div><h2 class="question-title">${esc(current.stem)}</h2><div class="note">Origem: questão autoral de treinamento (não oficial) · ${current.source.verified?'referência datada de '+day(current.source.verified+'T12:00:00')+' (não revalidada nesta sessão)':'fundamento sujeito a verificação'}. Não é item oficial do Cebraspe.</div>`;
if(!feedback){if(current.opts)h+=`<div class="options ${current.type==='ce'?'cecards':''}">${current.opts.map((x,i)=>`<button class="option ${selected===i?'selected':''}" onclick="choose(${i})">${current.type==='mc'?String.fromCharCode(65+i)+'. ':''}${esc(x)}</button>`).join('')}</div>`;else h+=`<textarea id="openAnswer" placeholder="Estruture fatos, regime jurídico, fundamentos, objeção e conclusão..." oninput="answerText=this.value">${esc(answerText)}</textarea><div class="note">Resposta discursiva: rascunho pessoal, sem correção automática. Não será pontuada, nem usada como evidência de domínio. Avaliação jurídica depende de serviço de correção com fontes verificadas.</div>`;h+=`<div class="btnrow"><button class="primary" ${current.opts&&selected===null?'disabled':''} onclick="submitAnswer()">${current.opts?'Conferir resposta':'Guardar rascunho sem pontuar'}</button></div>`}else{h+=`<div class="feedback ${feedback.correct===false?'bad':''}"><b>${esc(feedback.title)}</b><p>${esc(feedback.text)}</p>${evidencePanel(current)}</div>`;if(feedback.askWhy){h+=`<div class="note">Justificativa digitada desativada: esta versão não possui corretor semântico-jurídico. A resposta objetiva foi registrada; um acerto não comprova domínio argumentativo.</div><div class="btnrow"><button class="primary" onclick="nextQuestion()">Próximo desafio →</button><button class="secondary" onclick="setView('dashboard')">Encerrar quiz</button></div>`}else if(current.type==='open'&&!feedback.graded){h+=`<div class="note">O rascunho foi salvo, mas não existe correção jurídica automática nesta versão. Nenhuma rubrica de autoatribuição produzirá aprovação ou domínio.</div><div class="btnrow"><button class="primary" onclick="nextQuestion()">Próxima questão →</button><button class="secondary" onclick="setView('dashboard')">Encerrar quiz</button></div>`}else h+=`<div class="btnrow"><button class="primary" onclick="nextQuestion()">Próximo desafio →</button><button class="secondary" onclick="setView('dashboard')">Encerrar quiz</button></div>`}
return h+`</div></div><div class="card" style="margin-top:15px"><b>Regra de progressão</b><p class="muted">Acerto isolado não demonstra domínio. Para promover o tema, o aplicativo busca justificativa, aplicação e transferência. Respostas abertas passam por autoavaliação, não por correção oficial.</p></div>`}
function choose(i){selected=i;render()}
function updateTopic(t,credit,dim,verified){let p=data.topic[t]||{score:0,evidence:0,state:'Não iniciado'};p.score=Math.max(0,(p.score||0)+credit);p.evidence=(p.evidence||0)+(credit>0?1:0);p.last=now();p.dims=p.dims||{};if(credit>0)p.dims[dim]=true;let n=Object.keys(p.dims).length;p.state=credit<0?'Revisão necessária':p.score>=3&&n>=2?'Aplicação satisfatória (a homologar)':p.score>=1?'Compreensão inicial':'Em investigação';data.topic[t]=p;if(credit<0)schedule(t,1);persist()}
function schedule(t,stage){const delays=[1,7,21,45];let due=new Date(Date.now()+delays[Math.min(stage-1,3)]*86400000).toISOString();data.reviews=data.reviews.filter(x=>x.topic!==t);data.reviews.push({topic:t,due,stage});persist()}
function submitAnswer(){if(!current||feedback)return;let q=current;if(q.opts){if(selected===null)return;let correct=selected===q.right;data.answers.push({id:crypto.randomUUID(),question:q.id,topic:q.topic,curricular_id:questionMappings[q.id]||null,dim:q.dim,date:now(),selected,correct,origin:'inédita',sourceStatus:AUTHOR_NORM_AUDIT[q.id]?'base_normativa_pontualmente_conferida_sem_homologacao':'pendente',legalEvidence:LEGAL_EVIDENCE[q.id]?.ref||null});const earlier=data.answers.slice(0,-1).some(a=>a.question===q.id&&a.correct===true);const audited=!!AUTHOR_NORM_AUDIT[q.id];updateTopic(q.topic,correct&&audited?(earlier?0:0.8):correct?0:-1,q.dim,false);feedback={correct,title:correct?'Resposta correta — fundamente':'Revisão necessária',text:q.why,askWhy:correct,graded:!correct};if(correct){const old=data.reviews.find(r=>r.topic===q.topic);schedule(q.topic,old?Math.min(4,old.stage+1):1)}else schedule(q.topic,1)}else{if(answerText.trim().length<20)return;data.answers.push({id:crypto.randomUUID(),question:q.id,topic:q.topic,curricular_id:questionMappings[q.id]||null,dim:q.dim,date:now(),text:answerText,correct:null,origin:'inédita',sourceStatus:q.source.status});feedback={title:'Rascunho armazenado — não avaliado',text:'O texto fica preservado apenas para futura correção jurídica. Não será considerado acerto, nem evidência de domínio.',graded:false}}persist();render()}
function saveJustification(){let why=$('#why')?.value.trim()||'';if(why.length<15){alert('Inclua uma fundamentação mínima antes de avançar.');return}let a=data.answers[data.answers.length-1];a.justification=why;a.justificationReviewed=false;feedback.askWhy=false;feedback.graded=true;feedback.text+=' Sua fundamentação foi registrada, mas ainda não foi validada automaticamente.';persist();render()}
function saveRubric(){alert('Autoavaliação desativada: requer validação jurídica independente.');return;let c=[...document.querySelectorAll('.rubric:checked')].map(x=>Number(x.value));let a=data.answers[data.answers.length-1];a.selfRubric=c;a.correct=null;a.selfAssessment=c.length+'/5';a.correctionStatus='autoavaliação declarada';let p=data.topic[a.topic]||{score:0,evidence:0};p.last=now();p.state=p.score>0?'Compreensão inicial':'Em investigação';data.topic[a.topic]=p;feedback.graded=true;feedback.text=`Autoavaliação ${c.length}/5 registrada. A resposta não promove domínio demonstrado sem correção externa ou verificação posterior.`;schedule(a.topic,1);persist();render()}
function nextQuestion(){if(current)quizSeen.add(current.id);let pool=Q.filter(q=>q.topic===topicChoice&&(quizMode!=='ce'||q.type==='ce'));if(pool.length&&pool.every(q=>quizSeen.has(q.id))){quizSeen.clear();view='explore';feedback=null;render();return}startQuiz(topicChoice);if(current&&quizSeen.has(current.id)){const next=pool.find(q=>!quizSeen.has(q.id));if(next){current=next;render()}}}
function timeUI(){return `<div class="split"><div><div class="timer" id="timerdisplay">${mins(timerElapsed)}</div><div class="muted small">Tempo contado apenas enquanto cronômetro ativo nesta página</div></div><div class="btnrow"><button class="secondary" onclick="toggleTimer()">${timerRunning?'Pausar':'Iniciar / continuar'}</button><button class="primary" onclick="confirmTimer()">Confirmar tempo</button></div></div><div class="btnrow"><label>Ou registrar manualmente minutos efetivos: <input style="width:90px" id="manualMin" type="number" min="1" max="780" placeholder="min"></label><button class="secondary" onclick="addManual()">Registrar</button></div><p class="small muted">O cronômetro não é salvo como horas de estudo sem confirmação. Tempo de conversa não entra na contagem.</p>`}
setInterval(()=>{if(timerRunning){const m=timerElapsed+Math.floor((Date.now()-timerStart)/60000);const el=$('#timerdisplay');if(el)el.textContent=mins(m)}},1000);
function toggleTimer(){if(timerRunning){timerElapsed+=Math.floor((Date.now()-timerStart)/60000);timerRunning=false;timerStart=null}else{timerStart=Date.now();sessionStart=now();timerRunning=true}render()}
function confirmTimer(){if(timerRunning){timerElapsed+=Math.max(1,Math.floor((Date.now()-timerStart)/60000));timerRunning=false;timerStart=null}if(!timerElapsed){alert('Inicie o cronômetro ou registre tempo manual.');return}addSession(timerElapsed,'cronômetro');timerElapsed=0;render()}
function addManual(){const n=Number($('#manualMin')?.value);if(!Number.isInteger(n)||n<=0||n>780){alert('Informe entre 1 e 780 minutos líquidos.');return}addSession(n,'confirmado');render()}
function addSession(n,mode){data.sessions.push({id:crypto.randomUUID(),topic:topicChoice,started:sessionStart||now(),minutes:n,mode});sessionStart=null;persist();alert(`${n} min líquidos registrados em ${topicChoice.replace('/',' · ')}.`)}
function sessions(){return heading('Histórico de sessões','Tempo líquido confirmado e registro auditável')+`<div class="card"><h2>Adicionar tempo de estudo</h2><label>Tema <select onchange="topicChoice=this.value;render()">${allTopics().map(t=>`<option value="${t.id}" ${topicChoice===t.id?'selected':''}>${esc(t.id.replace('/',' · '))}</option>`).join('')}</select></label><div class="section">${timeUI()}</div></div><div class="card section"><h2>Registros de estudo</h2>${data.sessions.length?data.sessions.slice().reverse().map(s=>`<div class="history split"><div><b>${esc(s.topic.replace('/',' · '))}</b><div class="muted small">${day(s.started)} · ${esc(s.mode)}</div></div><strong>${mins(s.minutes)}</strong></div>`).join(''):'<div class="empty">Nenhuma sessão confirmada.</div>'}</div>`}
function notebook(){return heading('Caderno AGU','Registros acumulativos e exportação Markdown')+`<div class="card"><h2>Gerar registro de encerramento</h2><p class="muted">Use ao encerrar uma sessão. O registro reúne evidências coletadas no aplicativo e distingue autoavaliação de correção verificada.</p><label>Tema <select id="nbtopic">${allTopics().map(t=>`<option value="${t.id}" ${topicChoice===t.id?'selected':''}>${esc(t.id)}</option>`).join('')}</select></label><div class="section"><label>Hipótese inicial / evolução (opcional)<textarea id="nbHyp" placeholder="Registre sua hipótese inicial, distinções e evolução..."></textarea></label></div><div class="section"><label>Aplicação AGU / próximas dificuldades<textarea id="nbAgu" placeholder="Informe conclusão, objeção, providência e lacunas..."></textarea></label></div><div class="btnrow"><button class="primary" onclick="makeNotebook()">Consolidar registro</button><button class="secondary" onclick="downloadMarkdown()">Exportar Markdown</button></div></div><div class="card section"><h2>Registros</h2>${data.notebook.length?data.notebook.slice().reverse().map(n=>`<div class="history"><strong>${esc(n.title)}</strong><div class="small muted">${day(n.date)} · ${n.evidenceCount} resposta(s) · ${esc(n.state)}</div><p>${esc(n.summary)}</p></div>`).join(''):'<div class="empty">O Caderno ainda não tem registros. A criação é acionada por você, não por silêncio ou tempo de conversa.</div>'}</div>`}
function makeNotebook(){let t=$('#nbtopic').value;let ans=data.answers.filter(x=>x.topic===t),p=info(t);let number=data.notebook.filter(x=>x.topic===t).length+1;let title=`Caderno AGU — ${t.replace('/',' / ')} | Registro ${String(number).padStart(2,'0')}`;let record={id:crypto.randomUUID(),title,topic:t,date:now(),hypothesis:$('#nbHyp').value,agu:$('#nbAgu').value,evidenceCount:ans.length,state:p.state,summary:`${ans.filter(x=>x.correct===true).length} resposta(s) objetivas corretas; ${ans.filter(x=>x.correct===false).length} erro(s); ${ans.filter(x=>x.correct===null).length} aberta(s) não validadas.`,answers:ans.slice(-8),revisions:data.reviews.filter(x=>x.topic===t)};data.notebook.push(record);persist();render()}
function md(){return '# Caderno AGU — exportação local\n\nOrigem: aplicativo local. Não há sincronização com chats.\n\n'+data.notebook.map(n=>`## ${n.title}\n- Data: ${day(n.date)}\n- Tema: ${n.topic}\n- Estado: ${n.state}\n- Hipótese/evolução: ${n.hypothesis||'Não informada'}\n- Evidências: ${n.summary}\n- Aplicação AGU: ${n.agu||'Não informada'}\n- Revisões: ${n.revisions.map(r=>day(r.due)).join(', ')||'Nenhuma'}\n- Fundamentos: conferir fontes e vigência de cada resposta antes de tratar como verificados.\n- Ponto de retomada: ${n.topic}\n\n`).join('\n')}
function download(name,content,mime){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([content],{type:mime}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}

function settings(){return heading('Dados e confiabilidade','Persistência neste navegador · backup portátil · demonstração isolada')+`<div class="twocol"><div class="card"><h2>Modo de demonstração</h2><p>Os números fictícios não são seu desempenho. São dados temporários e separados dos registros reais.</p><div class="btnrow"><button class="${demo?'primary':'secondary'}" onclick="switchDemo()">${demo?'Sair da simulação':'Abrir simulação fictícia'}</button></div></div><div class="card"><h2>Armazenamento</h2><p>Registros reais salvos no armazenamento local do navegador, quando disponível. Não há conta, servidor, sincronização entre dispositivos ou entre chats.</p><div class="btnrow"><button class="secondary" onclick="exportJSON()">Exportar backup JSON</button><button class="secondary" onclick="$('#importjson').click()">Importar JSON</button><input id="importjson" type="file" accept="application/json" class="hidden" onchange="importJSON(event)"></div></div></div><div class="card"><h2>Fonte curricular GitHub</h2><p>A matriz pode ser importada em Matriz 2022. Ela fica em armazenamento local separado do histórico. Importar conteúdo nunca modifica respostas.</p><button class="secondary" onclick="setView('matrix')">Abrir integração curricular</button></div><div class="card"><h2>Reset de dados reais</h2><p>Apaga somente o histórico principal legado neste navegador; Caderno contextual, Revisão Inteligente e Planejamento permanecem. Antes, exporte uma cópia completa.</p><button class="danger" onclick="resetReal()" ${demo?'disabled':''}>Apagar dados locais</button></div><div class="card section"><h2>Qualidade das fontes</h2><div class="progresslist"><span>Origem da questão</span><b>Inédita pedagógica / oficial / adaptada</b><span>Fonte normativa</span><b>URL, dispositivo, data, status</b><span>Verificação de jurisprudência</span><b>Não implementada no MVP</b><span>Correção discursiva</span><b>Autoavaliação declarada</b><span>Última auditoria de edital</span><b>Pendente</b></div></div>`+(window.AGUBackup20?.panel?.()||'')}

function exportJSON(){download('agu_quiz_backup.json',JSON.stringify({schema:'agu-quiz-v1',exported:now(),data:real},null,2),'application/json')}
function validateMainBackup(raw){
 const obj=typeof raw==='string'?JSON.parse(raw):raw,st=obj?.data;
 if(obj?.schema!=='agu-quiz-v1'||!st||st.version!==1||!st.topic||typeof st.topic!=='object'||Array.isArray(st.topic))throw Error('Versão ou estrutura principal incompatível.');
 if(!window.AGUBackup20?.validateRecord?.('agu_quiz_mvp1_2026',st))throw Error('Histórico contém campos inválidos ou IDs repetidos. Nenhum dado foi substituído.');
 return st;
}
async function importJSON(e){
 const f=e?.target?.files?.[0];if(!f)return;
 try{
  if(f.size>3000000)throw Error('Arquivo acima de 3 MB.');
  const raw=await f.text();if(raw.length>3000000)throw Error('Arquivo acima de 3 MB.');
  const next=validateMainBackup(raw);
  if(!confirm('SUBSTITUIR apenas o histórico principal? Esta operação não altera Revisão Inteligente, Caderno contextual ou Planejamento. Exporte um backup antes de continuar.'))return;
  localStorage.setItem(STORE,JSON.stringify(next));real=next;data=real;demo=false;render();
 }catch(err){alert('Importação rejeitada: '+err.message)}
 finally{if(e?.target)e.target.value=''}
}

let organizationMode='prioridade';
function organizationData(){
 const review=window.AGUReview?.disciplineMetrics?.()||{};
 const today=new Date(),start=new Date(today);start.setHours(0,0,0,0);start.setDate(start.getDate()-(start.getDay()+6)%7);
 return D.filter(d=>d[0]!=='OUT').map(d=>{
  const [code,name]=d;
  const sessions=data.sessions.filter(s=>s.topic?.startsWith(code+'/')&&Number.isFinite(Number(s.minutes)));
  const minutes=sessions.reduce((n,s)=>n+Number(s.minutes||0),0);
  const weekly=sessions.filter(s=>new Date(s.started)>=start).reduce((n,s)=>n+Number(s.minutes||0),0);
  const a=data.answers.filter(x=>(x.curricular_id?.startsWith(code+'-')||x.topic?.startsWith(code+'/'))&&typeof x.correct==='boolean');
  const reviewStat=review[code]||{};
  const attempts=a.length+(reviewStat.attempts||0),correct=a.filter(x=>x.correct).length+(reviewStat.correct||0);
  const dueLocal=dueReview().filter(x=>x.topic?.startsWith(code+'/')).length;
  const due=dueLocal+(reviewStat.due||0);
  const topicStarted=d[2].filter(t=>data.topic[code+'/'+t]&&data.topic[code+'/'+t].state!=='Não iniciado').length;
  const seen=(reviewStat.seen||0),errors=(reviewStat.errors||0);
  const priority=due*15+errors*5+(attempts?Math.round((attempts-correct)/Math.max(1,attempts)*20):0);
  return {code,name,minutes,weekly,attempts,correct,due,errors,seen,topicStarted,topicTotal:d[2].length,priority,active:minutes>0||attempts>0||seen>0||topicStarted>0};
 });
}
function organization(){
 const all=organizationData();
 const order={prioridade:(a,b)=>b.priority-a.priority||Number(b.active)-Number(a.active)||a.name.localeCompare(b.name),
 horas:(a,b)=>b.minutes-a.minutes||a.name.localeCompare(b.name),
 constancia:(a,b)=>b.weekly-a.weekly||a.name.localeCompare(b.name),
 questoes:(a,b)=>b.attempts-a.attempts||a.name.localeCompare(b.name)};
 const sorted=all.slice().sort(order[organizationMode]||order.prioridade),active=all.filter(x=>x.active);
 const tabs=[['prioridade','Prioridades'],['horas','Horas'],['constancia','Semana'],['questoes','Questões']];
 const totalMinutes=all.reduce((n,x)=>n+x.minutes,0),totalWeekly=all.reduce((n,x)=>n+x.weekly,0);
 const count=all.reduce((n,x)=>n+x.attempts,0),correct=all.reduce((n,x)=>n+x.correct,0);
 const totalDue=all.reduce((n,x)=>n+x.due,0);
 const topDue=all.slice().filter(x=>x.due>0).sort((a,b)=>b.due-a.due)[0];
 const modeLabel={prioridade:'Revisões vencidas e erros registrados',horas:'Tempo líquido confirmado',constancia:'Tempo líquido na semana',questoes:'Tentativas objetivas registradas'}[organizationMode];
 let html=heading('Organização por matérias','Ranking individual de disciplinas · seu tempo, constância, questões e pendências')+
 '<div class="grid"><div class="card"><div class="muted">Disciplinas com atividade</div><div class="metric">'+active.length+'/'+all.length+'</div><div class="small muted">Dados deste navegador</div></div>'+
 '<div class="card"><div class="muted">Horas líquidas confirmadas</div><div class="metric">'+mins(totalMinutes)+'</div><div class="small muted">Semana: '+mins(totalWeekly)+'</div></div>'+
 '<div class="card"><div class="muted">Questões objetivas</div><div class="metric">'+count+'</div><div class="small muted">'+(count?'Acertos '+correct+' de '+count:'Amostra insuficiente')+'</div></div>'+
 '<div class="card"><div class="muted">Revisões vencidas</div><div class="metric">'+totalDue+'</div><div class="small muted">Fila local e Revisão Inteligente</div></div></div>'+
 '<div class="card"><h2>Organizar a semana</h2><p>'+ (topDue?'Primeiro foco: <b>'+esc(topDue.name)+'</b> ('+topDue.due+' revisões vencidas).':'Ainda não há revisões vencidas entre os conteúdos registrados.')+
 ' O plano dá prioridade ao que precisa ser retomado, sem exigir que você escolha matérias diariamente.</p>'+
 '<div class="btnrow"><button class="primary" onclick="setView(\'review\')">Abrir Revisão Inteligente</button><button class="secondary" onclick="setView(\'sessions\')">Registrar sessão</button></div></div>'+
 '<div class="card"><h2>Ranking por disciplinas</h2><p class="muted small">'+modeLabel+'. Ordenação baseada apenas em dados efetivos, não em nota de domínio.</p>'+
 '<div class="btnrow">'+tabs.map(([key,label])=>'<button class="'+(organizationMode===key?'primary':'secondary')+'" onclick="setOrganizationMode(\''+key+'\')">'+label+'</button>').join('')+'</div>'+
 '<div class="section">'+sorted.map((x,i)=>{
  const visual=organizationMode==='horas'?mins(x.minutes):organizationMode==='constancia'?mins(x.weekly):organizationMode==='questoes'?x.attempts+' tentativas':x.due+' revisões';
  const sample=x.attempts?x.correct+'/'+x.attempts+' acertos':'Sem questões respondidas';
  const main=x.active?'<b>'+esc(x.name)+'</b>':'<span class="muted">'+esc(x.name)+'</span>';
  return '<div class="history"><div class="split"><div><span class="muted small">'+String(i+1).padStart(2,'0')+' · '+esc(x.code)+'</span> '+main+'</div><strong>'+visual+'</strong></div>'+
   '<div class="small muted">Tempo total: '+mins(x.minutes)+' · semana: '+mins(x.weekly)+' · '+sample+' · revisão vencida: '+x.due+' · cartões vistos: '+x.seen+'</div>'+
   '<div class="small muted">Tópicos iniciados no mapa provisório: '+x.topicStarted+'/'+x.topicTotal+'</div></div>';
 }).join('')+'</div></div>'+
 '<div class="note">Sem atividade registrada, a disciplina aparece sem desempenho, não com nota zero. A posição por prioridade é operacional (vencimentos e erros), não uma avaliação de domínio jurídico. Só há dados deste navegador; horas e tentativas não incluem registros externos.</div>';
 return html;
}
