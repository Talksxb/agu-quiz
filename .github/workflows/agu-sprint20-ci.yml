  pages-revisao-compativel:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Conferir se a correção do teste mantém os arquivos publicados
        id: compat
        env:
          AGU_PAGES_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --quiet "$AGU_PAGES_BASE_SHA" HEAD -- tests/sprint21-pages.cjs; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$AGU_PAGES_BASE_SHA" HEAD -- ':(top,glob)*.html' ':(top,glob)*.js' ':(top,glob)*.css' dados livros lib fontes; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.compat.outputs.run == 'true'
        with:
          node-version: '22'
      - name: Cotejar arquivos públicos usando o verificador corrigido
        if: steps.compat.outputs.run == 'true'
        run: node tests/metodo-agu-002-pages.cjs && node tests/sprint21-pages.cjs
      - name: Preparar navegador em contexto efêmero
        if: steps.compat.outputs.run == 'true'
        run: npm install --no-save playwright axe-core && npx playwright install --with-deps chromium
      - name: Conferir Método e backup na URL publicada sem dados pessoais
        if: steps.compat.outputs.run == 'true'
        env:
          AGU_TEST_URL: https://talksxb.github.io/agu-quiz/
        run: node tests/metodo-agu-001-browser.cjs && node tests/metodo-agu-003-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always() && steps.compat.outputs.run == 'true'
        with:
          name: agu-pages-verificacao-pr
          path: |
            tests/artifacts-metodo-agu/
            tests/artifacts-metodo-agu-003/
          retention-days: 7

  pages-publicado:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: MÉTODO-AGU-002 — edição pública, catálogo, capítulos e recursos por hash
        run: node tests/metodo-agu-002-pages.cjs
      - name: Verificar HTTPS, HTML e hashes do GitHub Pages ativo
        run: node tests/sprint21-pages.cjs
      - name: LEIT-META-002 — arquivo publicado por GitHub Pages
        run: |
          node -e "fetch('https://talksxb.github.io/agu-quiz/laboratorio-leitura.html').then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.text()}).then(t=>{if(!t.includes('Laboratório de Leitura Jurídica'))throw Error('Conteúdo divergente'); console.log('LAB_PUBLICADO_OK')}).catch(e=>{console.error(e);process.exit(1)})"
      - name: Instalar navegador para validar a URL publicada
        run: npm install --no-save playwright axe-core && npx playwright install --with-deps chromium
      - name: Método AGU na URL publicada — quatro capítulos e quatro larguras
