<svg baseProfile="full" height="940px" version="1.1" viewBox="0 0 900 940" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs></defs><rect fill="#FFFFFF" height="940" rx="0" ry="0" stroke="#FFFFFF" stroke-width="1.4" width="900" x="0" y="0"></rect><text fill="#18334B" font-family="Arial,DejaVu Sans,sans-serif" font-size="28" font-weight="bold" text-anchor="start" x="42" y="55">SUPLETIVA × SUBSIDIÁRIA</text><text fill="#106775" font-family="Arial,DejaVu Sans,sans-serif" font-size="16" font-weight="normal" text-anchor="start" x="42" y="86">Dois modos diferentes de cooperação administrativa</text><rect fill="#E7F0FA" height="660" rx="13" ry="13" stroke="#E7F0FA" stroke-width="1.4" width="392" x="40" y="130"></rect><rect fill="#E6F1EA" height="660" rx="13" ry="13" stroke="#E6F1EA" stroke-width="1.4" width="392" x="468" y="130"></rect><text fill="#18334B" font-family="Arial,DejaVu Sans,sans-serif" font-size="23" font-weight="bold" text-anchor="middle" x="236" y="178">ATUAÇÃO SUPLETIVA</text><text fill="#106775" font-family="Arial,DejaVu Sans,sans-serif" font-size="16" font-weight="bold" text-anchor="middle" x="236" y="231">Natureza</text><text fill="#23313B" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="normal" text-anchor="middle" x="236" y="264">Substituição do ente</text><text fill="#106775" font-family="Arial,DejaVu Sans,sans-serif" font-size="16" font-weight="bold" text-anchor="middle" x="236" y="344">Base</text><text fill="#23313B" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="normal" text-anchor="middle" x="236" y="377">LC 140, arts. 2º, II, e 15</text><text fill="#106775" font-family="Arial,DejaVu Sans,sans-serif" font-size="16" font-weight="bold" text-anchor="middle" x="236" y="457">Gatilho</text><text fill="#23313B" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="normal" text-anchor="middle" x="236"