name: QUESTOES-AGU-001 · PDF local e responsividade
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  questoes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/questoes-agu-001.cjs
      - run: npm install --no-save --ignore-scripts pdfjs-dist@4.10.38 playwright axe-core
      - run: node scripts/preparar-pdfjs.cjs
      - run: npx playwright install --with-deps chromium
      - name: Caderno oficial temporário (não publicar nem arquivar)
        run: curl -fL --retry 2 --max-time 90 'https://cdn.cebraspe.org.br/concursos/agu_22_advogado/arquivos/804_AGU_ADVOGADO_001_01.PDF' -o "${RUNNER_TEMP}/agu2023.pdf" && sha256sum "${RUNNER_TEMP}/agu2023.pdf"
      - name: Jornada local e seis larguras
        run: AGU2023_PDF="${RUNNER_TEMP}/agu2023.pdf" node tests/questoes-agu-001-browser.cjs
      - name: Arquivar apenas evidência de QA sem conteúdo da prova
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: questoes-agu-001-qa
          path: |
            tests/artifacts-questoes-agu-001/antes-*.png
            tests/artifacts-questoes-agu-001/axe.json
          if-no-files-found: warn
