name: QUESTOES-AGU-002 · AU2015 e banco integrado
on:
  pull_request:
    branches: [main, feat/questoes-agu-001]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  questoes2015:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/questoes-agu-002.cjs
      - run: npm install --no-save --ignore-scripts pdfjs-dist@6.5.438 playwright axe-core
      - run: node scripts/preparar-pdfjs.cjs
      - name: PDF oficial e gabarito temporários
        run: |
          curl -fL --retry 2 --max-time 120 'https://cdn.cebraspe.org.br/concursos/AGU_15_ADV/arquivos/187AGU_001_07.pdf' -o "$RUNNER_TEMP/agu2015.pdf"
          curl -fL --retry 2 --max-time 60 'https://cdn.cebraspe.org.br/concursos/AGU_15_ADV/arquivos/Gab_Definitivo_187AGU_001_07_SUPER-A4.pdf' -o "$RUNNER_TEMP/gabarito2015.pdf"
          sha256sum "$RUNNER_TEMP/agu2015.pdf" "$RUNNER_TEMP/gabarito2015.pdf"
          echo "9b2ebbe52c3cce634d144239f158efc663689ea087f44bcd9c6fd94c4198c9bd  $RUNNER_TEMP/gabarito2015.pdf" | sha256sum -c
          node -e 'const fs=require("fs"),c=require("crypto"),p="dados/questoes-agu-2015-integridade.json",h=c.createHash("sha256").update(fs.readFileSync(process.env.RUNNER_TEMP+"/agu2015.pdf")).digest("hex"),o=JSON.parse(fs.readFileSync(p));if(o.sha256&&o.sha256!==h)throw Error("hash divergente");fs.writeFileSync(p,JSON.stringify({sha256:h}));console.log("AU2015_SHA256="+h)'
      - run: npx playwright install --with-deps chromium
      - run: AGU2015_PDF="$RUNNER_TEMP/agu2015.pdf" node tests/questoes-agu-002-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: questoes-agu-002-qa
          path: |
            tests/artifacts-questoes-agu-002/antes-*.png
            tests/artifacts-questoes-agu-002/axe.json
          if-no-files-found: warn
