<svg baseProfile="full" height="1350px" version="1.1" viewBox="0 0 900 1350" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs></defs><rect fill="#FFFFFF" height="1350" rx="0" ry="0" stroke="#FFFFFF" stroke-width="1.4" width="900" x="0" y="0"></rect><text fill="#18334B" font-family="Arial,DejaVu Sans,sans-serif" font-size="28" font-weight="bold" text-anchor="start" x="42" y="55">CASO PRÁTICO AGU</text><text fill="#106775" font-family="Arial,DejaVu Sans,sans-serif" font-size="16" font-weight="normal" text-anchor="start" x="42" y="86">Rodovia federal: dois Estados, um licenciamento, fiscalização comum</text><rect fill="#E7F0FA" height="120" rx="13" ry="13" stroke="#E7F0FA" stroke-width="1.4" width="760" x="70" y="125"></rect><text fill="#18334B" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="bold" text-anchor="middle" x="450.0" y="159">FATO QUALIFICADOR</text><text fill="#23313B" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="normal" text-anchor="middle" x="450.0" y="191">Obra efetivamente situada em Serra Azul e Vale Verde</text><text fill="#23313B" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="normal" text-anchor="middle" x="450.0" y="216">Impacto significativo; estudo ambiental e participação</text><line stroke="#106775" stroke-linecap="round" stroke-width="3.5" x1="450" x2="450" y1="251" y2="268"></line><polyline fill="none" points="441,256 450,268 459,256" stroke="#106775" stroke-width="3.5"></polyline><rect fill="#EAF2F4" height="118" rx="13" ry="13" stroke="#EAF2F4" stroke-width="1.4" width="760" x="70" y="279"></rect><text fill="#18334B" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="bold" text-anchor="middle" x="450.0" y="313">COMPETÊNCIA</text><text fill="#23313B" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="normal" text-anchor="middle" x="450.0" y="345">IBAMA: art. 7º, XIV, e, da LC 140/2011</text><text fill="#23313B" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="normal" text-anchor="middle" x="450.0" y="370">Sem duplicidade de licença estadual/municipal</text><line stroke="#106775" stroke-linecap="round" stroke-width="3.5" x1="450" x2="450" y1="403" y2="420"></line><polyline fill="none" points="441,408 450,420 459,408" stroke="#106775" stroke-width="3.5"></polyline><rect fill="#E6F1EA" height="136" rx="13" ry="13" stroke="#E6F1EA" stroke-width="1.4" width="760" x="70" y="431"></rect><text fill="#18334B" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="bold" text-anchor="middle" x="450.0" y="465">COOPERAÇÃO</text><text fill="#23313B" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="normal" text-anchor="middle" x="450.0" y="497">Considerar estudos estaduais e municipais</text><text fill="#23313B" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="normal" text-anchor="middle" x="450.0" y="522">Motivar acolhimento ou rejeição; não há veto automático</text><line stroke="#106775" stroke-linecap="round" stroke-width="3.5" x1="450" x2="450" y1="573" y2="590"></line><polyline fill="none" points="441,578 450,590 459,578" stroke="#106775" stroke-width="3.5"></polyline><rect fill="#FFF4E3" height="143" rx="13" ry="13" stroke="#FFF4E3" stroke-width="1.4" width="760" x="70" y="601"></rect><text fill="#18334B" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="bold" text-anchor="middle" x="450.0" y="635">DANO E FISCALIZAÇÃO</text><text fill="#23313B" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="normal" text-anchor="middle" x="450.0" y="667">Preservar fiscalização comum e medidas urgentes</text><text fill="#23313B" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="normal" text-anchor="middle" x="450.0" y="692">Comparar autos; checar mesma infração e resposta federal</text><text fill="#23313B" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="normal" text-anchor="middle" x="450.0" y="717">Não afirmar nulidade automática da autuação estadual</text><line stroke="#106775" stroke-linecap="round" stroke-width="3.5" x1="450" x2="450" y1="750" y2="767"></line><polyline fill="none" points="441,755 450,767 459,755" stroke="#106775" stroke-width="3.5"></polyline><rect fill="#EAF2F4" height="144" rx="13" ry="13" stroke="#EAF2F4" stroke-width="1.4" width="760" x="70" y="778"></rect><text fill="#18334B" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="bold" text-anchor="middle" x="450.0" y="812">RENOVAÇÃO E MORA</text><text fill="#23313B" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="normal" text-anchor="middle" x="450.0" y="844">Sem licença tácita; conferir requerimento tempestivo</text><text fill="#23313B" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="normal" text-anchor="middle" x="450.0" y="869">Cobrar decisão e proteção efetiva; avaliar supletividade</text><line stroke="#106775" stroke-linecap="round" stroke-width="3.5" x1="450" x2="450" y1="928" y2="944"></line><polyline fill="none" points="441,932 450,944 459,932" stroke="#106775" stroke-width="3.5"></polyline><rect fill="#E7F0FA" height="154" rx="13" ry="13" stroke="#E7F0FA" stroke-width="1.4" width="760" x="70" y="955"></rect><text fill="#18334B" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="bold" text-anchor="middle" x="450.0" y="989">PROVIDÊNCIA DA AGU</text><text fill="#23313B" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="normal" text-anchor="middle" x="450.0" y="1021">Parecer: competência federal + integração técnica</text><text fill="#23313B" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="normal" text-anchor="middle" x="450.0" y="1046">Instar órgãos a cooperar; corrigir omissões</text><text fill="#23313B" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="normal" text-anchor="middle" x="450.0" y="1071">Defender atos válidos e impugnar excessos com prova</text><text fill="#106775" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="450" y="1192">RESULTADO: competência definida, proteção reforçada e conflito saneado.</text></svg>