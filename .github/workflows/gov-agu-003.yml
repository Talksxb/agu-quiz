name: GOV-AGU-003 · treino vigente
on:
  pull_request:
    branches: [main]
    paths: ['questoes-vigentes*','dados/questoes-vigentes*','questoes-agu-bank.js','tests/gov-agu-003*','.github/workflows/gov-agu-003.yml']
  push:
    branches: [main]
    paths: ['questoes-vigentes*','dados/questoes-vigentes*','questoes-agu-bank.js','tests/gov-agu-003*','.github/workflows/gov-agu-003.yml']
permissions:
  contents: read
jobs:
  validacao:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/gov-agu-003.cjs && node tests/questoes-agu-003.cjs
      - run: npm install --no-save --ignore-scripts playwright
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/gov-http.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:8765/questoes-vigentes.html >/dev/null && break; sleep 1; done
          node tests/gov-agu-003-browser.cjs
          node tests/gov-agu-004-browser.cjs
