name: AGU Quiz · Integridade, estudo e acessibilidade
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '*.html'
      - '*.js'
      - '*.css'
      - 'dados/**'
      - 'livros/**'
      - 'lib/**'
      - 'scripts/**'
      - 'fontes/**'
      - 'tests/**'
      - '.github/workflows/agu-sprint20-ci.yml'
  workflow_dispatch:
jobs:
  integridade-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Node.js runtime
        run: node --version
      - name: SIMULADOS-AGU-001 — questões, cronômetro, correção, versões e preservação
        run: node scripts/gerar-simulados.cjs --check && node tests/simulados-agu-001.cjs
      - name: LEIT-META-001 — fluxo sintético, integridade e persistência segregada
        run: node tests/leitura-meta-001-validacao.js
      - name: LIVROS-LEIT-001 — integridade do acervo, capítulo completo e hashes legados
        run: node tests/livros-leit-001-validacao.js
      - name: MÉTODO-AGU-001 — ingestão, segurança editorial e idempotência
        run: node scripts/metodo-agu.cjs --check && node tests/metodo-agu-001-validacao.cjs
      - name: MÉTODO-AGU-003 — percurso no backup, compatibilidade e restauração não destrutiva
        run: node tests/metodo-agu-003-validacao.cjs
      - name: MÉTODO-AGU-004 — verificador Pages aceita bytes iguais e rejeita divergência
        run: node tests/metodo-agu-004-pages-validacao.cjs
      - name: LIVROS-EDITOR-001 — fidelidade textual de AMB-03 e recursos visuais
        run: node tests/livros-editor-001-fidelidade.cjs
      - name: LIVRO-SITES-001 — atalho público sem vazar acervo privado
        run: node tests/livro-sites-001-validacao.js
      - name: CARTOES-AUD-01 — fontes públicas, 8 cartas e motor preservado
        run: node tests/cartoes-aud-01-validacao.js
      - name: CARTOES-AUD-02 — quatro cartas, 2015, fontes e revisão preservada
        run: node tests/cartoes-aud-02-validacao.js
      - name: CARTOES-AUD-03 — três cartas, gabarito histórico e estado preservado
        run: node tests/cartoes-aud-03-validacao.js
      - name: Regressão Sprint 19
        run: node tests/sprint19-validacao.js
      - name: Regressão Sprint 20
        run: node tests/sprint20-validacao.js
      - name: Sprint 25 — limite em bytes e recuperação UTF-8 não destrutiva
        run: node tests/sprint25-validacao.js
      - name: Sprint 26 — anotações do Leitor devem ser texto válido
        run: node tests/sprint26-validacao.js
      - name: Sprint 27 — IDs e estados do Leitor no backup local
